[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/academy-supervisor.pid

[program:apache]
command=/usr/local/bin/apache2-foreground
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:video-worker]
command=/usr/local/bin/node index.js
directory=/var/www/html/video-worker
user=www-data
environment=PORT="3300",PRIVATE_STORAGE_ROOT="/var/www/html/storage/app/private",INTERNAL_CALLBACK_URL="http://127.0.0.1/internal/video-processing"
priority=20
autostart=true
autorestart=true
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-queue]
command=/usr/local/bin/php artisan queue:work database --sleep=3 --tries=3 --timeout=120
user=www-data
directory=/var/www/html
priority=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=150
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-scheduler]
command=/usr/local/bin/php artisan schedule:work --no-interaction
user=www-data
directory=/var/www/html
priority=40
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
