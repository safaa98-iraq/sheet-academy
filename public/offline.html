<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e96d28">
    <title>أنت غير متصل | عيادة التعلّم</title>
    <style>
        :root { color-scheme: light dark; --surface: #fff; --background: #f7f8fa; --text: #20232b; --muted: #737987; --line: #e4e6eb; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--background); color: var(--text); font-family: Tahoma, Arial, sans-serif; }
        main { width: min(100%, 480px); padding: 48px 32px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 40px #00000005; }
        svg { width: 64px; height: 64px; margin-bottom: 20px; color: var(--muted); }
        .brand { margin: 0 0 24px; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
        h1 { margin: 0 0 14px; font-size: 25px; line-height: 1.6; }
        p { color: var(--muted); font-size: 15px; line-height: 1.9; margin: 0 0 28px; }
        button { width: 100%; border: 0; border-radius: 8px; background: #e96d28; color: #fff; padding: 14px 24px; font: 700 15px Tahoma, Arial, sans-serif; cursor: pointer; }
        button:focus-visible { outline: 3px solid #fdba74; outline-offset: 4px; }
        .hint { font-size: 12px; margin: 22px 0 0; }
        @media (prefers-color-scheme: dark) { :root { --surface: #1b1e25; --background: #13151b; --text: #f3f4f7; --muted: #a0a5b2; --line: #2f3440; } }
    </style>
</head>
<body>
    <main>
        <div class="brand">عيادة التعلّم</div>
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 24a36 36 0 0 1 12-7m13-2a36 36 0 0 1 21 9M17 34a23 23 0 0 1 13-6m10 1a23 23 0 0 1 7 5M25 44a10 10 0 0 1 14 0M10 10l44 44"/><circle cx="32" cy="53" r="2" fill="currentColor" stroke="none"/></svg>
        <h1>نعود للتعلّم عند عودة الاتصال</h1>
        <p>تحقّق من اتصالك بالإنترنت ثم حاول مجدداً. سنعيد فتح الصفحة التي كنت تتصفحها.</p>
        <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
        <p class="hint">تحتاج الدروس والملازم إلى اتصال بالإنترنت.</p>
    </main>
</body>
</html>
