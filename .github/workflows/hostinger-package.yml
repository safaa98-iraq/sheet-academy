name: Build Hostinger package
on:
  workflow_dispatch:
  push:
    branches: [codex/hostinger-preparation, codex/shared-hosting-video]
  pull_request:
    paths:
      - 'app/**'
      - 'config/**'
      - 'resources/**'
      - 'tests/**'
      - 'docs/hostinger-*'
      - 'docs/hostinger.env.example'
      - '.github/workflows/hostinger-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, pdo_mysql, pdo_sqlite, gd
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --optimize-autoloader
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Format changed PHP files
        run: |
          vendor/bin/pint --dirty --format agent
          vendor/bin/pint --format agent app/Video/Mp4Metadata.php app/Video/VideoProcessingGateway.php app/Video/VideoStreamService.php app/Video/VideoUploadService.php app/Models/LessonVideo.php app/Http/Controllers/Admin/VideoUploadController.php app/Http/Controllers/Student/VideoStreamController.php config/services.php tests/Feature/DirectVideoTest.php
          git diff --exit-code
      - run: php artisan test --compact
      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - run: composer check-platform-reqs --no-dev
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: bash -n docs/hostinger-finalize.sh docs/hostinger-cron.sh
      - run: python3 docs/hostinger-package.py --output /tmp/sheet-academy-hostinger.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sheet-academy-hostinger
          path: /tmp/sheet-academy-hostinger.zip
          retention-days: 14
